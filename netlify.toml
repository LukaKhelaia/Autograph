# Netlify build settings for the Autograph site.
#
# This app is server-side rendered, so the Angular runtime plugin is what turns
# the SSR output into a Netlify function. Keeping these settings in the repo
# means a new Netlify site picks them up automatically instead of relying on
# whatever is typed into the dashboard.
[build]
  command = "npm run build"
  publish = "dist/autograph/browser"

[[plugins]]
  package = "@netlify/angular-runtime"
