<header [class.entered]="headerEntered" (animationend)="onHeaderAnimationEnd()">
    <a routerLink="/" (click)="onLogoClick($event)" class="logo-link">
        <img src="assets/logo.png" class="logo" alt="logo">
    </a>

    <button class="burger" [class.open]="mobileMenuOpen" (click)="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav [class.mobile-open]="mobileMenuOpen">
         <button (click)="swichLanguage('en')" class="flag" *ngIf="selectedLanguage === 'ka'"><svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-gb" viewBox="0 0 512 512">

            <path fill="#C8102E" d="M0 208v96h512v-96zM208 0v512h96V0z"/>
          </svg></button>
          <button (click)="swichLanguage('ka')" class="flag" *ngIf="selectedLanguage === 'en'"><svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-ge" viewBox="0 0 512 512">

        <a id="menuNavLink" routerLink="/" (click)="onMenuClick($event)">{{ selectedLanguage === 'ka' ? 'მენიუ' : 'Menu' }}</a>
